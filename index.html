<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Website Factory</title>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
    .card { background: #1e293b; border: 1px solid #334155; padding: 2rem; border-radius: 12px; width: 100%; max-width: 480px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
    h1 { font-size: 1.5rem; margin-top: 0; text-align: center; color: #38bdf8; }
    label { display: block; margin-top: 1rem; font-size: 0.875rem; color: #94a3b8; }
    input, textarea, select { width: 100%; padding: 0.75rem; margin-top: 0.375rem; border-radius: 6px; border: 1px solid #475569; background: #0f172a; color: #fff; font-size: 1rem; }
    button { width: 100%; margin-top: 1.5rem; padding: 0.875rem; border: none; border-radius: 6px; background: #2563eb; color: #fff; font-weight: bold; font-size: 1rem; cursor: pointer; transition: background 0.2s; }
    button:hover { background: #1d4ed8; }
    button:disabled { background: #475569; cursor: not-allowed; }
    #status { margin-top: 1.5rem; display: none; background: #0f172a; padding: 1rem; border-radius: 6px; font-size: 0.9rem; }
    .step { margin: 0.5rem 0; color: #64748b; }
    .step.active { color: #38bdf8; font-weight: bold; }
    .step.done { color: #22c55e; }
    #resultLink { display: none; margin-top: 1.5rem; text-align: center; }
    #resultLink a { display: inline-block; width: 100%; padding: 0.875rem; background: #22c55e; color: #fff; text-decoration: none; border-radius: 6px; font-weight: bold; }
  </style>
</head>
<body>

<div class="card">
  <h1>AI Website Factory ✨</h1>

  <form id="factoryForm">
    <label>Business Name</label>
    <input type="text" id="businessName" placeholder="e.g., LensCraft Studio" required>

    <label>What does the business do?</label>
    <textarea id="businessDesc" rows="3" placeholder="e.g., Premium photography studio offering wedding and portrait sessions." required></textarea>

    <label>Design Style</label>
    <select id="designStyle">
      <option value="Luxury / Minimal">Luxury / Minimal</option>
      <option value="Modern / Bold">Modern / Bold</option>
      <option value="Warm / Artisanal">Warm / Artisanal</option>
      <option value="Tech / Cyberpunk">Tech / Cyberpunk</option>
    </select>

    <button type="submit" id="submitBtn">GENERATE WEBSITE ✨</button>
  </form>

  <div id="status">
    <div id="step1" class="step">Understanding business...</div>
    <div id="step2" class="step">Creating design & code...</div>
    <div id="step3" class="step">Deploying site...</div>
  </div>

  <div id="resultLink">
    <p style="color: #22c55e; font-weight: bold; margin-top: 0;">✓ WEBSITE LIVE!</p>
    <a id="finalUrl" href="#" target="_blank">OPEN WEBSITE 🚀</a>
  </div>
</div>

<script>
  // REPLACE THIS WITH YOUR ACTUAL MAKE WEBHOOK URL
  const MAKE_WEBHOOK_URL = "https://hook.eu1.make.com/j9cpbke6qhwnro9qb513xgtwl8pxv4x9";

  document.getElementById('factoryForm').addEventListener('submit', async (e) => {
    e.preventDefault();

    const submitBtn = document.getElementById('submitBtn');
    const statusDiv = document.getElementById('status');
    const resultDiv = document.getElementById('resultLink');

    submitBtn.disabled = true;
    statusDiv.style.display = 'block';
    resultDiv.style.display = 'none';

    // UI Progress Flow
    const s1 = document.getElementById('step1');
    const s2 = document.getElementById('step2');
    const s3 = document.getElementById('step3');

    s1.className = 'step active';

    const payload = {
      name: document.getElementById('businessName').value,
      description: document.getElementById('businessDesc').value,
      style: document.getElementById('designStyle').value
    };

    try {
      setTimeout(() => { s1.className = 'step done'; s2.className = 'step active'; }, 1500);
      setTimeout(() => { s2.className = 'step done'; s3.className = 'step active'; }, 4000);

      const response = await fetch(MAKE_WEBHOOK_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });

      const data = await response.json(); // Expects Make to return { "url": "https://..." }

      s3.className = 'step done';
      document.getElementById('finalUrl').href = data.url;
      resultDiv.style.display = 'block';
    } catch (err) {
      alert("Error triggering webhook or generating website.");
      console.error(err);
    } finally {
      submitBtn.disabled = false;
    }
  });
</script>

</body>
</html>
